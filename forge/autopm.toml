[product]
name         = "AutoPM"
version      = "0.3.1"
publisher    = "Locke Werks"
description  = "Learn the project manager's job by doing it, one question at a time."
url          = "https://github.com/Locke-Werks/AutoPM"
icon         = "autopm.ico"
upgrade_code = "6f2c9d41-5b3e-4a77-9c12-0e8a4d6b21f5"
aumid        = "LockeWerks.AutoPM"

# Per-user: each person runs their own install, and records live under their
# own Documents. Nothing here needs the machine.
[install]
scope     = "user"
dir       = '{LocalPrograms}\AutoPM'
elevation = "on-demand"

[ui]
# The installer wears the application's own palette rather than the house
# default, so the first thing it shows looks like the thing being installed.
theme.background   = "#07050E"
theme.surface      = "#100B20"
theme.border       = "#29B05CF6"
theme.border_hover = "#57B05CF6"
theme.accent       = "#B05CF6"
theme.accent_soft  = "#1EB05CF6"
theme.text         = "#F7EFFC"
theme.text_body    = "#D9C8E8"
theme.text_muted   = "#B9A3CF"
theme.text_faint   = "#8D70A4"
theme.error        = "#FF1E3C"
theme.success      = "#3D7DFF"
theme.warning      = "#FF5A2A"

warning = "Unsigned. There is no code signing certificate for this build, so Windows will warn about it."

