name: release

on:
  push:
    tags: ['v*']

env:
  # Pinned, so a Forge release cannot change what this job produces without
  # somebody choosing it. v0.4.0 or later is required for the build-time checks
  # on hooks and options.
  FORGE_VERSION: v0.4.1

jobs:
  release:
    # Pinned, not windows-latest. That label now resolves to
    # windows-2025-vs2026, which carries Visual Studio 2026 and no 2022
    # instance, so the generator below finds nothing. Qt ships this
    # application's binaries as win64_msvc2022_64, so the runner should be the
    # one whose toolset those were built against.
    runs-on: windows-2022
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      # The tag is what people will quote. An installer that calls itself
      # 0.1.0 under a v0.2.0 tag is the kind of thing nobody notices until a
      # support conversation goes sideways.
      - name: The tag and the config agree on the version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $declared = (Select-String -Path forge/autopm.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag $tag, config $declared"
          if ($tag -ne $declared) {
            throw "tag is $tag but forge/autopm.toml declares $declared"
          }

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Everything under stage/ lands on the customer's disk byte for byte.
      - name: Stage the payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item build/Release/AutoPM.exe      stage/
          Copy-Item build/Release/autopm-mcp.exe  stage/
          Copy-Item LICENSE                       stage/LICENSE.txt
          Copy-Item definitions stage/definitions -Recurse
          Copy-Item assets      stage/assets      -Recurse
          # The Qt runtime, including imageformats/qico.dll, without which the
          # window falls back to the shell's placeholder icon.
          windeployqt --release --no-translations --no-opengl-sw --no-system-d3d-compiler stage/AutoPM.exe
          Get-ChildItem stage -Recurse -File | Measure-Object -Property Length -Sum |
            ForEach-Object { "payload: {0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }

      # Forge hashes the payload into the container and extracts it verbatim,
      # so an unsigned binary going in stays unsigned on the installed machine.
      # Signing the finished installer does nothing for these.
      - name: Sign the payload
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: stage
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          # Certificates are valid for three days. Without the timestamp the
          # signature stops validating within the week.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge `
            --pattern '*.exe' --dir forge-tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "forge-tools/$name"
            "$name : $($sig.Status)"
            # An unsigned stub becomes an unsigned uninstaller, permanently, in
            # the install directory where Settings invokes it.
            if ($sig.Status -ne 'Valid') { throw "forge-tools/$name is $($sig.Status)" }
          }

      # forge/*.ico is generated rather than committed, so the release job draws
      # it the same way a developer does.
      - name: Draw the installer icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tools/make-icon.py
          python tools/check-icon.py assets/autopm.ico
          Copy-Item assets/autopm.ico forge/autopm.ico -Force

      # The committed config carries an unsigned-build warning so a local
      # --dev installer says so on its first page. This build is signed, so
      # that sentence would be a lie in the one place people trust it.
      - name: Drop the unsigned-build warning
        shell: pwsh
        run: |
          $path = 'forge/autopm.toml'
          (Get-Content $path) | Where-Object { $_ -notmatch '^warning\s*=' } | Set-Content $path
          if (Select-String -Path $path -Pattern '^warning\s*=' -Quiet) {
            throw "the unsigned-build warning is still in $path"
          }

      # No --sign here. That flag shells out to scripts/sign.ps1 resolved
      # against the working directory, which exists only in the Forge repo.
      - name: Forge the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./forge-tools/lwforge.exe build `
            --config forge/autopm.toml `
            --payload stage `
            --stub forge-tools/lwstub.exe `
            --out dist/AutoPM-Setup.exe

      # Last, after resource stamping and the container append have already
      # rewritten the image.
      - name: Sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/AutoPM-Setup.exe
          "installer: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer is $($sig.Status)" }

          # Signing appended a certificate table after the container. This
          # proves it did not orphan the payload.
          ./forge-tools/lwforge.exe inspect dist/AutoPM-Setup.exe
          if ($LASTEXITCODE -ne 0) {
            throw "the signed installer cannot read its own container"
          }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/AutoPM-Setup.exe `
            --repo "${{ github.repository }}" `
            --title "AutoPM ${{ github.ref_name }}"
